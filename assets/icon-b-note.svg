  <g fill="#fffaf1">
    <rect x="100" y="36" width="16" height="98" rx="8"/>
    <path d="M112 36 C 144 48, 162 72, 149 106 C 153 74, 135 58, 112 60 Z"/>
  </g>

  <circle cx="70" cy="132" r="34" fill="#fffaf1"/>
  <circle cx="70" cy="132" r="14" fill="#c32679"/>
</svg>
