<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- C: a note sitting on a staff -- reading music, no instrument implied. -->
  <rect width="192" height="192" rx="42" fill="#cfe3f2"/>

  <g stroke="#4a3f35" stroke-width="11" stroke-linecap="round">
    <line x1="34" y1="54" x2="158" y2="54"/>
    <line x1="34" y1="96" x2="158" y2="96"/>
    <line x1="34" y1="138" x2="158" y2="138"/>
  </g>

  <!-- stem, drawn under the head so the join stays clean -->
  <rect x="98" y="30" width="14" height="74" rx="7" fill="#4a3f35"/>

  <ellipse cx="76" cy="96" rx="31" ry="24" fill="#c32679" stroke="#4a3f35" stroke-width="7"
           transform="rotate(-18 76 96)"/>
</svg>
